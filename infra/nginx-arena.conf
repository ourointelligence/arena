# OURO Arena locations, included inside the https server block for ourosi.xyz.
# /etc/nginx/snippets/arena.conf  (install.sh copies it there and adds the include and the limit_req zone)

# the page: static build with SPA fallback for /arena/s/*, long cache for hashed assets, no cache for index.html
location ^~ /arena/assets/ {
    alias /var/www/arena/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
location = /arena {
    return 301 /arena/;
}
location /arena/ {
    alias /var/www/arena/;
    index index.html;
    try_files $uri $uri/ /arena/index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    location = /arena/index.html {
        alias /var/www/arena/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }
}

# the read-only API, proxied to the local Hono server; the event stream is never buffered
location /arena/api/ {
    limit_req zone=arena_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787/arena/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    add_header X-Content-Type-Options "nosniff" always;
}
location /arena/api/stream {
    limit_req zone=arena_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787/arena/api/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering "no";
    add_header Cache-Control "no-store";
}
